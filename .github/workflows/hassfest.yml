name: hassfest

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  hassfest:
    name: Validate manifest.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: "home-assistant/actions/hassfest@master"  # stable branch
