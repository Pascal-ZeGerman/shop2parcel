name: hassfest

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  hassfest:
    name: Validate manifest.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: "home-assistant/actions/hassfest@master"  # stable branch
