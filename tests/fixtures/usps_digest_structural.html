    <!-- Package 1: named shipper -->
    <tr><td>
      <p>FROM: <b><span id="pra-shipper-name-id">PRIMARY KIDS INC</span></b></p>
      <p><a id="tracking-number-href-id" href="https://tools.usps.com/go/TrackConfirmAction?tLabels=9261290316868031775213"><span id="pra-tracking-number-id">9261290316868031775213</span></a></p>

    </td></tr>

    <!-- Package 2: empty shipper span -->
    <tr><td>
      <p>FROM: <b><span id="pra-shipper-name-id"></span></b></p>
      <p><a id="tracking-number-href-id" href="https://tools.usps.com/go/TrackConfirmAction?tLabels=9400111899223450094040"><span id="pra-tracking-number-id">9400111899223450094040</span></a></p>
